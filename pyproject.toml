[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-study"
version = "0.1.0"
description = "Local SQLite-backed certification question bank and adaptive mini-exam CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "Thomas Tickle"}]
dependencies = []

[project.scripts]
aws-study = "aws_study.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
aws_study = ["schema*.sql"]
